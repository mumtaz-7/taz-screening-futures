name: crypto-scan-futures

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-scan-futures
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Jalankan scanner futures
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_UPDATES: ${{ secrets.TELEGRAM_CHAT_ID_UPDATES }}
        run: node scan.js

      - name: Simpan state + track record
        run: |
          git config user.name "futures-scanner-bot"
          git config user.email "futures-scanner-bot@users.noreply.github.com"
          git add state.json journal.json stats.json
          git commit -m "update state and track record" || echo "no changes"
          git push || echo "push skipped"
